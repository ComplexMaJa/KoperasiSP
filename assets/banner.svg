<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">KoperasiSP</title>
  <desc id="desc">Project banner for KoperasiSP, a cooperative savings and loan management platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111F" />
      <stop offset="0.43" stop-color="#0F766E" />
      <stop offset="1" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="card" x1="760" y1="78" x2="1160" y2="342" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.28" />
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="32" fill="url(#bg)" />
  <rect width="1280" height="420" rx="32" fill="url(#grid)" />
  <circle cx="1080" cy="70" r="210" fill="#FFFFFF" opacity="0.12" />
  <circle cx="106" cy="352" r="180" fill="#14B8A6" opacity="0.20" />
  <circle cx="432" cy="82" r="86" fill="#F97316" opacity="0.14" />

  <g filter="url(#shadow)">
    <rect x="760" y="74" width="414" height="272" rx="24" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.24" />
    <rect x="802" y="116" width="138" height="30" rx="15" fill="#ECFEFF" fill-opacity="0.92" />
    <rect x="960" y="116" width="118" height="30" rx="15" fill="#FEF3C7" fill-opacity="0.92" />
    <rect x="802" y="176" width="316" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.82" />
    <rect x="802" y="214" width="250" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.54" />
    <rect x="802" y="252" width="292" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.64" />
    <rect x="802" y="292" width="116" height="18" rx="9" fill="#34D399" fill-opacity="0.9" />
    <path d="M1010 300C1038 262 1060 240 1098 220" stroke="#FBBF24" stroke-width="10" stroke-linecap="round" />
    <path d="M1010 300C1058 298 1090 276 1122 236" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="4" stroke-linecap="round" />
  </g>

  <text x="84" y="142" fill="#FFFFFF" font-size="76" font-weight="800" font-family="Inter, Segoe UI, Arial, sans-serif" letter-spacing="0">KoperasiSP</text>
  <text x="88" y="194" fill="#E0F2FE" font-size="26" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">Smart cooperative savings and loan platform</text>
  <text x="90" y="244" fill="#FFFFFF" fill-opacity="0.78" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif">Members. Savings. Loans. Installments. Reports. Roles.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="88" y="294" width="128" height="38" rx="19" fill="#0F172A" fill-opacity="0.50" stroke="#FFFFFF" stroke-opacity="0.18" />
    <text x="112" y="319" fill="#FFFFFF">React + Vite</text>
    <rect x="230" y="294" width="126" height="38" rx="19" fill="#0F172A" fill-opacity="0.50" stroke="#FFFFFF" stroke-opacity="0.18" />
    <text x="254" y="319" fill="#FFFFFF">Laravel API</text>
    <rect x="370" y="294" width="132" height="38" rx="19" fill="#0F172A" fill-opacity="0.50" stroke="#FFFFFF" stroke-opacity="0.18" />
    <text x="394" y="319" fill="#FFFFFF">Supabase SQL</text>
    <rect x="516" y="294" width="104" height="38" rx="19" fill="#0F172A" fill-opacity="0.50" stroke="#FFFFFF" stroke-opacity="0.18" />
    <text x="540" y="319" fill="#FFFFFF">Reports</text>
  </g>
